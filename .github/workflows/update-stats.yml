name: Update GitHub Profile Statistics

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: "0 0 * * *"

  # Allows you to run the workflow manually
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT REPOSITORY
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # =========================================================
      # GENERATE GITHUB STATISTICS CARD
      # =========================================================

      - name: Generate GitHub Statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats

          options: >-
            username=${{ github.repository_owner }}
            &show_icons=true
            &hide_border=true
            &include_all_commits=true
            &count_private=true
            &bg_color=0D1117
            &title_color=58A6FF
            &text_color=C9D1D9
            &icon_color=58A6FF
            &border_color=30363D

          path: profile/stats.svg

          token: ${{ secrets.GITHUB_TOKEN }}


      # =========================================================
      # GENERATE TOP LANGUAGES CARD
      # =========================================================

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs

          options: >-
            username=${{ github.repository_owner }}
            &layout=compact
            &langs_count=8
            &hide_border=true
            &count_private=true
            &bg_color=0D1117
            &title_color=58A6FF
            &text_color=C9D1D9
            &border_color=30363D

          path: profile/top-langs.svg

          token: ${{ secrets.GITHUB_TOKEN }}


      # =========================================================
      # CHECK GENERATED FILES
      # =========================================================

      - name: Check generated statistics
        run: |
          echo "Generated files:"
          ls -lh profile/


      # =========================================================
      # COMMIT UPDATED STATISTICS
      # =========================================================

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg
          git add profile/top-langs.svg

          git diff --cached --quiet || git commit -m "Update GitHub profile statistics"

          git push
